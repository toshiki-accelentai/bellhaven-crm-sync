<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Bellhaven CRM sync review</title>
<style>
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:#f5f6f8;color:#1c2330}
main{max-width:1100px;margin:0 auto;padding:16px}
.banner{background:#b45309;color:#fff;text-align:center;padding:10px;font-weight:700}
.flash{padding:10px 14px;border-radius:6px;margin:8px 0}.flash.ok{background:#dcfce7}.flash.error{background:#fee2e2}
.tabs a{display:inline-block;padding:6px 14px;border-radius:6px;text-decoration:none;color:#1c2330;background:#e5e7eb;margin-right:6px}
.tabs a.on{background:#1c2330;color:#fff}
.counts span{display:inline-block;margin:6px 10px 0 0;font-size:13px;color:#4b5563}
.card{background:#fff;border:1px solid #d9dde3;border-radius:8px;padding:14px 16px;margin:14px 0}
.card h3{margin:6px 0}.meta{color:#4b5563;font-size:13px}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:700;color:#fff;margin-right:6px}
.CHOW{background:#dc2626}.REPARENT{background:#ea580c}.DUPLICATE{background:#7c3aed}.STALE{background:#6b7280}
.NEW{background:#16a34a}.UPDATE{background:#2563eb}.COSMETIC{background:#cbd5e1;color:#1c2330}
.tag{background:#fde68a;color:#78350f}.status{background:#e5e7eb;color:#1c2330}
table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
th,td{border:1px solid #e5e7eb;padding:3px 7px;text-align:left;vertical-align:top}th{background:#f3f4f6}
.sop{background:#fef9c3;border:2px solid #eab308;border-radius:6px;padding:8px 12px;margin:8px 0;font-size:16px}
.box{background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;padding:6px 12px;margin:8px 0}
pre{background:#111827;color:#e5e7eb;padding:10px;border-radius:6px;overflow:auto;font-size:12px}
.actions{display:flex;gap:10px;align-items:center;margin-top:10px}.actions form{margin:0}
button{font:inherit;padding:6px 16px;border:0;border-radius:6px;cursor:pointer;color:#fff}
.go{background:#16a34a}.no{background:#dc2626}button:disabled{opacity:.5}
h4{margin:10px 0 2px}
</style></head><body>
{% if dry_run %}<div class="banner">DRY RUN — approvals will not write to the CRM</div>{% endif %}
<main>
{% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
{% block body %}{% endblock %}
</main></body></html>
